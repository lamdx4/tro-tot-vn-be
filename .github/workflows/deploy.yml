name: Deploy Backend to Server

on:
  push:
    branches:
      - deploy # Hoặc 'dev' tùy theo nhánh bạn dùng để deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "--- Bắt đầu Workflow Deploy ---"

            # 1. Điều hướng vào thư mục root của dự án
            cd ~/projects/tro-tot-vn          

            # 2. Di chuyển vào thư mục backend và build lại container
            # (Lưu ý: dùng file compose tại infras/compose/)
            cd tro-tot-vn-be
            git pull origin

            echo "--- Đang build và restart container backend ---"
            docker compose -f ../infras/compose/docker-compose.dev.yaml build backend
            docker compose -f ../infras/compose/docker-compose.dev.yaml up -d backend

            # 3. Dọn dẹp các ảnh cũ để tiết kiệm dung lượng server
            docker image prune -f

            echo "--- Deploy hoàn tất thành công! ---"
