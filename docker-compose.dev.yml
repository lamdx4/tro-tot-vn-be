services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: tro-tot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: tro_tot_db
      MYSQL_USER: tro_tot_user
      MYSQL_PASSWORD: tro_tot_pass123
    ports:
      - "${DOCKER_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tro-tot-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tro-tot-redis
    restart: unless-stopped
    ports:
      - "${DOCKER_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - tro-tot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  tro-tot-network:
    driver: bridge

