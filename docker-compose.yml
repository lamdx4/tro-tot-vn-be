version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tro-tot-mssql
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "YourStrong!Password123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Password123' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - tro-tot-network

  redis:
    image: redis:7-alpine
    container_name: tro-tot-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tro-tot-network

  # Coturn TURN server for WebRTC
  coturn:
    image: coturn/coturn:latest
    container_name: tro-tot-coturn
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49172:49152-49172/udp"  # RTP media ports range
    command: >
      -n
      --listening-port=3478
      --min-port=49152
      --max-port=49172
      --realm=tro-tot.local
      --lt-cred-mech
      --use-auth-secret
      --static-auth-secret=tro-tot-secret-2024
      --log-file=stdout
    volumes:
      - coturn_data:/var/lib/turn
    networks:
      - tro-tot-network
    restart: unless-stopped

networks:
  tro-tot-network:
    driver: bridge

volumes:
  mssql_data:
  redis_data:
  coturn_data:
